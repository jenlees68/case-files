<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Case Files Detective</title>
<meta name="theme-color" content="#121a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Case Files">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&family=Special+Elite&display=swap">
<style>
/* Layout: one-screen game. Thin HUD strip on top, one stage below. World = a detective's corkboard at night: navy board, manila case files, pink pushpin string. */
:root{
  --bg:#121a36; --board:#1b2550; --board2:#232f63; --line:#34407a;
  --paper:#f4e9cc; --paper2:#e9dbb4; --paper-ink:#2b2416;
  --text:#eef1ff; --muted:#a8b2de;
  --hi:#ffe14d; --pin:#ff5c8a; --good:#3ee6a8; --nudge:#ffb547;
  --f-display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-type:'Special Elite','Courier New',Courier,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.4;
  background-image:radial-gradient(circle at 20% 0%,#1e2a5c 0,transparent 55%),radial-gradient(circle at 100% 100%,#24184a 0,transparent 50%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
#app{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}

#stage{display:flex;flex-direction:column;gap:14px;min-width:0}
/* HUD */
#hud{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
#hud[hidden]{display:none!important}
.hbtn{flex:none;min-width:46px;height:46px;border-radius:14px;background:var(--board2);border:2px solid var(--line);font-size:20px;display:grid;place-items:center;padding:0 10px}
.hcase{font-family:var(--f-type);color:var(--muted);font-size:13px;white-space:nowrap}
.meter{flex:1 1 60px;min-width:50px;height:16px;border-radius:99px;background:var(--board);border:2px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pin),var(--hi));transition:width .5s cubic-bezier(.3,1.4,.6,1);border-radius:99px}
.pts{font-family:var(--f-display);font-size:22px;color:var(--hi);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.flame{font-family:var(--f-display);font-size:18px;color:var(--nudge);min-width:44px;text-align:center;transition:transform .2s}
.flame.pop{transform:scale(1.5)}

/* generic */
.card{background:var(--board);border:2px solid var(--line);border-radius:20px;padding:18px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 20px;box-shadow:0 10px 0 -4px var(--paper2),0 14px 30px rgba(0,0,0,.4);position:relative}
.paper::before{content:"";position:absolute;top:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pin);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 3px 4px rgba(0,0,0,.4)}
.big{font-family:var(--f-display);letter-spacing:.02em;text-wrap:balance;line-height:1.05}
.typed{font-family:var(--f-type)}
.btn{min-height:64px;border-radius:18px;padding:12px 26px;font-weight:800;font-size:22px;background:var(--hi);color:#1b1b2a;box-shadow:0 6px 0 #b89b10;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b89b10}
.btn.alt{background:var(--board2);color:var(--text);box-shadow:0 6px 0 #0c1230;border:2px solid var(--line)}
.btn.pink{background:var(--pin);color:#fff;box-shadow:0 6px 0 #a8204a}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.line1{font-size:20px;color:var(--muted);text-align:center;margin:0}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-family:var(--f-display);font-size:20px;color:var(--hi)}
.pips{display:flex;gap:6px}
.pips b{width:16px;height:16px;border-radius:50%;background:var(--board2);border:2px solid var(--line);transition:background .3s,transform .3s}
.pips b.on{background:var(--good);border-color:var(--good);transform:scale(1.15)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.badge-big{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--hi),var(--nudge),var(--hi));display:grid;place-items:center;box-shadow:0 0 0 6px var(--board2),0 0 0 9px var(--hi);animation:spin 18s linear infinite}
.badge-big span{font-size:52px;animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.rank{font-family:var(--f-type);color:var(--pin);font-size:18px;text-transform:uppercase;letter-spacing:.12em}
.title{font-size:clamp(34px,8vw,58px);margin:4px 0;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--board2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:26px;color:var(--hi);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bdg{background:var(--board2);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;color:var(--muted);border:2px dashed var(--line)}
.bdg i{display:block;font-style:normal;font-size:34px;filter:grayscale(1) brightness(.5)}
.bdg.got{border:2px solid var(--hi);color:var(--text)}
.bdg.got i{filter:none}
.h2{font-family:var(--f-display);font-size:18px;color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
.archive{display:flex;flex-direction:column;gap:8px}
.arc{display:flex;justify-content:space-between;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:8px 12px;font-family:var(--f-type);font-size:15px}
.arc b{color:#b3123f}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.suspect{background:#fbf8ef;color:var(--paper-ink);border-radius:6px;padding:8px 8px 10px;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));transition:transform .2s,outline-color .2s;position:relative;outline:4px solid transparent;min-width:0}
.suspect:nth-child(1){--r:-2deg}.suspect:nth-child(2){--r:1.5deg}.suspect:nth-child(3){--r:-1deg}
.suspect .av{font-size:46px;background:#cfd7f2;border-radius:4px;padding:4px 0}
.suspect .nm{font-weight:800;font-size:18px;margin:4px 0}
.chips{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.chip{font-size:13px;background:#ece4cf;border-radius:8px;padding:2px 6px;display:flex;align-items:center;gap:5px;justify-content:center;transition:background .3s}
.chip.bad{background:var(--nudge)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--sw);border:1px solid rgba(0,0,0,.3)}
.suspect.out{opacity:.45}
.suspect.out::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:110px;color:#b3123f;font-family:var(--f-display);pointer-events:none}
.suspect.sel{outline-color:var(--hi);transform:rotate(0) scale(1.04)}
.suspect.mini .av{font-size:34px}.suspect.mini .nm{font-size:15px}.suspect.mini .chip{font-size:11px}
.pop-in{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.4) rotate(-8deg);opacity:0}}

/* board */
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sta{background:var(--board2);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:14px;color:var(--muted)}
.sta i{display:block;font-style:normal;font-size:32px}
.sta.done{border-color:var(--good);color:var(--good)}
.sta.next{border-color:var(--hi);color:var(--text);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,225,77,.25)}}
.notebook{display:flex;flex-direction:column;gap:10px}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px 14px;font-size:18px;display:flex;gap:10px;align-items:baseline;transition:background .3s}
.clue b{font-family:var(--f-type);color:#b3123f;white-space:nowrap}
.clue.flag{background:var(--nudge)}
.clue.empty{background:transparent;border:2px dashed var(--line);color:var(--muted)}

/* safe */
.safe{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(160deg,#4a557f,#2b3360);border-radius:22px;padding:18px;border:4px solid #6c78a8;box-shadow:inset 0 0 0 6px #232a4f}
.dial{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#cfd5ea 0 30%,#8792bb 31% 60%,#59638f 61%);position:relative;transition:transform .5s cubic-bezier(.3,1.5,.5,1);box-shadow:0 4px 0 #1b2147}
.dial::after{content:"";position:absolute;top:6px;left:50%;width:6px;height:18px;margin-left:-3px;background:var(--pin);border-radius:3px}
.lcd{background:#0b1f17;border-radius:12px;padding:12px 16px;font-family:var(--f-display);font-size:clamp(34px,8vw,52px);color:#7dffc4;text-shadow:0 0 12px rgba(125,255,196,.6);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;min-width:0}
.lcd .ans{min-width:1.6em;border-bottom:4px solid #7dffc4;text-align:center}
.lights{grid-column:1/-1;display:flex;gap:10px;justify-content:center}
.lights b{width:22px;height:22px;border-radius:50%;background:#3a1630;border:3px solid #1b2147;transition:background .3s,box-shadow .3s}
.lights b.on{background:var(--good);box-shadow:0 0 14px var(--good)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.key{height:68px;border-radius:16px;background:var(--board2);border:2px solid var(--line);font-family:var(--f-display);font-size:28px;box-shadow:0 5px 0 #0c1230}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #0c1230}
.key.go{background:var(--good);color:#0b2a1e;border-color:var(--good);box-shadow:0 5px 0 #1d8a63}
.wobble{animation:wob .45s}
@keyframes wob{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.hintbox{background:rgba(255,181,71,.12);border:2px solid var(--nudge);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.hintbox p{margin:0;font-size:19px}
.skip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.skip span{background:var(--nudge);color:#2a1a00;border-radius:10px;padding:4px 10px;font-weight:800;font-size:20px;animation:popin .3s both}
.dots{display:grid;gap:5px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--hi);display:block;animation:popin .3s both}

/* split */
.eq{font-family:var(--f-display);font-size:clamp(40px,10vw,64px);text-align:center;color:var(--hi);margin:0}
.loot{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:520px;margin:0 auto}
.loot i{width:16px;height:16px;border-radius:50%;background:var(--hi);display:block;transition:opacity .3s}
.bags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bag{min-width:74px;min-height:74px;border-radius:14px 14px 26px 26px;background:#7b5a2e;border:3px solid #a57a3e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;color:#fff3cf}
.bag .bdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:64px}
.bag .bdots i{width:10px;height:10px;border-radius:50%;display:block;animation:popin .3s both}
.bag b{font-family:var(--f-display);font-size:22px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px;margin:0 auto;width:100%}
.choice{min-height:78px;border-radius:18px;background:var(--board2);border:3px solid var(--line);font-family:var(--f-display);font-size:34px;box-shadow:0 5px 0 #0c1230}
.choice.glow{border-color:var(--hi);animation:pulse 1s infinite}
.choice.dim{opacity:.35}
.choice.right{background:var(--good);color:#0b2a1e;border-color:var(--good)}

/* code breaker */
.hear{width:96px;height:96px;border-radius:50%;background:var(--pin);font-size:42px;box-shadow:0 6px 0 #a8204a;display:grid;place-items:center}
.hear:active{transform:translateY(4px);box-shadow:0 2px 0 #a8204a}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:64px;border-radius:10px;background:#0b1f17;border:3px solid #2c6b52;font-family:var(--f-display);font-size:34px;color:#7dffc4;display:grid;place-items:center;text-transform:lowercase}
.slot.cur{border-color:var(--hi)}
.slot.filled{animation:popin .25s both}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:560px;margin:0 auto}
.tile{width:64px;height:68px;border-radius:12px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-type);font-size:38px;box-shadow:0 5px 0 var(--paper2)}
.tile.used{visibility:hidden}
.tile.glow{background:var(--hi);animation:pulse .9s infinite}

/* witness */
.statement{font-size:clamp(26px,6vw,36px);line-height:1.6;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;text-align:center}
.w{padding:0 4px;border-radius:8px;transition:background .25s,color .25s;cursor:pointer;border-bottom:3px solid transparent}
.w.ok{background:var(--good);color:#0b2a1e}
.w.now{border-bottom-color:var(--hi)}
.w.stuck{background:var(--nudge);color:#2a1a00;animation:pulse 1s infinite}
.w.fixed{background:#9ff3d0;color:#0b2a1e}
.w.find{background:var(--hi);color:#1b1b2a}
.mic{width:110px;height:110px;border-radius:50%;background:var(--pin);font-size:48px;display:grid;place-items:center;box-shadow:0 6px 0 #a8204a}
.mic.live{animation:live 1.2s ease-in-out infinite}
.mic.go{background:var(--good);box-shadow:0 6px 0 #1d8a63}
@keyframes live{50%{box-shadow:0 0 0 18px rgba(255,92,138,.25),0 6px 0 #a8204a}}
.heard{font-family:var(--f-type);font-size:14px;color:var(--muted);text-align:center;margin:0;word-break:break-word}
.status{font-size:18px;color:var(--muted);min-height:1.4em;text-align:center;margin:0}
.fixword{font-family:var(--f-display);font-size:clamp(44px,12vw,72px);color:var(--nudge);background:none}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}

.wgrid{display:grid;gap:5px;width:100%;max-width:440px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wc{aspect-ratio:1;border-radius:10px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-display);font-size:clamp(18px,5.6vw,30px);display:grid;place-items:center;box-shadow:0 3px 0 var(--paper2);transition:background .15s,transform .15s;cursor:pointer}
.wc.sel{background:var(--hi);transform:scale(1.06)}
.wc.anchor{outline:4px solid var(--pin);outline-offset:-2px}
.wc.found{color:#0b2a1e}
.wc.nope{animation:wob .4s}
.wc.glow{animation:pulse .9s infinite;outline:4px solid var(--hi);outline-offset:-2px}
.hwords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hw{background:var(--board2);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:19px;min-height:46px;letter-spacing:.04em}
.hw.done{background:var(--good);color:#0b2a1e;border-color:var(--good);text-decoration:line-through}
.pup-case{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:14px 18px;min-height:84px;box-shadow:0 6px 0 var(--paper2);transform:rotate(-.6deg);transition:transform .1s}
.pup-case:active{transform:translateY(4px) rotate(-.6deg);box-shadow:0 2px 0 var(--paper2)}
.pc-em{font-size:50px;line-height:1;animation:wag 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.pc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pc-tag{font-family:var(--f-type);color:#b3123f;font-size:14px;letter-spacing:.12em}
.pc-txt b{font-family:var(--f-display);font-size:22px;font-weight:400}
.pup-row{display:flex;align-items:center;gap:14px;font-size:54px;line-height:1}
.pup-row .q{font-family:var(--f-display);color:var(--pin);font-size:44px;animation:pulse 1.4s infinite;border-radius:50%}
.pup-hug{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grow>div:first-child{display:flex;flex-direction:column;min-width:0}
.grow>div:first-child span{color:var(--muted);font-size:14px}
.gbtns{display:flex;gap:6px}
.gb{width:44px;height:44px;border-radius:12px;background:var(--board2);border:2px solid var(--line);font-family:var(--f-display);font-size:20px}
.gb.on{background:var(--hi);color:#1b1b2a;border-color:var(--hi)}
.dots i.pk{background:var(--pin)}
.dots i.gone{opacity:.25;position:relative}
.dots i.gone::after{content:"";position:absolute;left:-2px;right:-2px;top:6px;height:2px;background:var(--text);transform:rotate(-35deg)}
.bag.left{background:#5a2a3e;border-color:var(--pin)}
.choice.wide{font-size:26px}
.arc-entry{display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(135deg,#3b2a7a,#1e4f8a);border:2px solid #6c78d8;border-radius:18px;padding:12px 18px;min-height:76px;box-shadow:0 6px 0 #141a45}
.arc-entry:active{transform:translateY(4px);box-shadow:0 2px 0 #141a45}
.arc-entry>span:first-child{font-size:42px}
.arc-entry>span:last-child{display:flex;flex-direction:column}
.arc-entry b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--hi)}
.arc-entry span span{color:var(--muted);font-size:15px}
.arc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.arc-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--board);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 5px 0 #0c1230;min-width:0}
.arc-tile:active{transform:translateY(3px);box-shadow:0 2px 0 #0c1230}
.arc-tile:last-child:nth-child(odd){grid-column:1/-1}
.at-icon{font-size:40px}
.at-cat{font-family:var(--f-type);font-size:12px;color:var(--pin);letter-spacing:.12em}
.arc-tile b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1}
.at-tag{color:var(--muted);font-size:14px}
.at-best{margin-top:4px;font-weight:800;color:var(--hi);font-size:15px}
.timer{font-family:var(--f-display);font-size:28px;color:var(--good);font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--pin);animation:pulse .6s infinite;border-radius:10px}
.blast{background:radial-gradient(circle,#2e3b80,var(--board));border:3px solid var(--line);border-radius:24px;padding:24px 10px;text-align:center;position:relative}
.bl-q{font-family:var(--f-display);font-size:clamp(44px,13vw,72px);color:var(--hi)}
.bl-combo{font-family:var(--f-display);color:var(--pin);font-size:20px;min-height:1.2em}
.choices.three{grid-template-columns:repeat(3,1fr);max-width:520px}

function makeCase(){S.caseNo++;

  var attrs=shuffle(ATTRS);
  var people=shuffle(PEOPLE).slice(0,3);var sus,cul;

    sus=people.map(function(p){var t={};ATTRS.forEach(function(k){t[k]=pick(TR[k].vals);});return {name:p[0],av:p[1],t:t};});
    cul=sus[0];
    var fits=function(s,k){return attrs.slice(0,k).every(function(a){return s.t[a]===cul.t[a];});};
    var others=sus.slice(1);
    if(others.some(function(o){return fits(o,4);}))continue;
    if(!others.some(function(o){return fits(o,2);}))continue;
    break;}
  var stations=order.map(function(type,i){var a=attrs[i],v=cul.t[a];
    var st={type:type,attr:a,done:false};

function buildHunt(L,g){g=g||gr('spell');var size=[6,7,8][L-1]+(g>=4?1:0),count=[4,5,6][L-1],diag=L>=3;

  for(var attempt=0;attempt<60;attempt++){var g=[],r,c,k;for(r=0;r<size;r++){g.push([]);for(c=0;c<size;c++)g[r].push('');}
    var placed={},ok=true;var order=words.slice().sort(function(a,b){return b.length-a.length;});
    for(var wi=0;wi<order.length&&ok;wi++){var W=order[wi].toUpperCase(),put=false;
      for(var t=0;t<300&&!put;t++){var d=pick(dirs),r0=rnd(0,size-1),c0=rnd(0,size-1);
        if(r0+d[0]*(W.length-1)>=size||c0+d[1]*(W.length-1)>=size)continue;
        var fits=true;for(k=0;k<W.length;k++){var ch=g[r0+d[0]*k][c0+d[1]*k];if(ch&&ch!==W[k]){fits=false;break;}}
        if(!fits)continue;var cells=[];
        for(k=0;k<W.length;k++){g[r0+d[0]*k][c0+d[1]*k]=W[k];cells.push((r0+d[0]*k)*size+(c0+d[1]*k));}
        placed[order[wi]]=cells;put=true;}

    if(ok){var FILL='ABCDEFGHIKLMNOPRSTUVWY',letters=[];
      for(r=0;r<size;r++)for(c=0;c<size;c++)letters.push(g[r][c]||FILL[rnd(0,FILL.length-1)]);

function huntStation(done){var sk=S.skills.hunt,L=sk.lvl,P=buildHunt(L);

  var COLS=['#3ee6a8','#7cc4ff','#ffb547','#ff8fb1','#c6a2ff','#9be564'];

  var cells='';letters.forEach(function(ch,i){cells+='<div class="wc" data-i="'+i+'">'+ch+'</div>';});

    '<div class="hwords" id="hwords">'+list+'</div>'+
    '<div class="wgrid" id="wg" style="grid-template-columns:repeat('+size+',1fr)">'+cells+'</div><div id="hint"></div>';

  function rc(i){return [Math.floor(i/size),i%size];}

    if(n===0)return [a];if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return null;

  function show(sel){cellEls.forEach(function(c){c.classList.remove('sel');});(sel||[]).forEach(function(i){cellEls[i].classList.add('sel');});}

    /* --- mic mode ---
       Listens in short rounds (the way phones hear best) and carries words over between rounds,
       so nothing is lost when the phone stops and starts listening. */
    var best=0,anchor=0,committed=[],listening=false,fixing=false,lastProg=Date.now(),lastSound=0,trailAt=0,noise=0,helpShown=false;
    ctrl.innerHTML='<button class="mic" id="micBtn" aria-label="Start reading">🎙️</button><p class="status" id="status">Tap the mic, then read.</p><div id="assist"></div><button class="link" id="noMic">Mic not working? Read without it</button>';
    $('#noMic').onclick=function(){micBroken=true;stopAll();toast('Okay! Tap mode is on.');render();};
    paint(0);
    function fatal(err){return ['not-allowed','service-not-allowed','audio-capture','language-not-supported'].indexOf(err)>=0;}
    function stopAll(){stopAllMic();}
    function micFail(){micBroken=true;stopAll();toast('Mic is off here, so we switched to tap mode.');setTimeout(render,600);}
    function setStatus(t){var s=$('#status');if(s)s.textContent=t;}
    function setGo(on){var mb=$('#micBtn');if(mb)mb.classList.toggle('go',!!on);}
    function unjoin(t){return String(t).replace(/\bhotdog(s?)\b/gi,'hot dog$1');}
    function tokensOf(t){return unjoin(t).split(/\s+/).map(normWord).filter(function(x){return x&&!FILLER[x];});}
    function showHeard(results){if(!S.micDebug)return;var el=$('#heard');if(!el)return;var t=[];for(var q=0;q<results.length;q++)t.push(results[q][0].transcript);el.textContent='Mic heard: '+t.join(' | ');}
    /* try each of the phone's guesses and keep whichever gets her furthest */
    function roundTokens(results){var base=committed.slice(),i,a;
      for(i=0;i<results.length;i++){var res=results[i],pickW=[],pickP=-1,pickBad=1e9;
        for(a=0;a<res.length;a++){var cand=tokensOf(res[a].transcript);var r=align(base.concat(cand),W,anchor);var bad=(r.problem>=0?100:0)+r.trail;
          if(r.p>pickP||(r.p===pickP&&bad<pickBad)){pickP=r.p;pickBad=bad;pickW=cand;}}
        base=base.concat(pickW);}
      return base;}
    function showReadIt(){if(helpShown||!$('#assist'))return;helpShown=true;
      $('#assist').innerHTML='<button class="btn alt" id="readIt" style="min-height:50px;font-size:18px">✋ I read it!</button>';
      $('#readIt').onclick=function(){SFX.tap();stopAll();listening=false;spans.forEach(function(s,i){if(i>=best)s.classList.add('fixed');});finished(true);};}
    function startListen(){if(fixing)return;stopAllMic();listening=true;var rec,roundToks=null;
      try{rec=new SR();}catch(e){micFail();return;}
      rec.lang='en-US';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=5;liveRecs.push(rec);
      var mb=$('#micBtn');if(mb)mb.classList.add('live');
      rec.onaudiostart=function(){if(listening&&!fixing){setGo(true);setStatus('Go! Read out loud.');}};
      rec.onresult=function(e){if(fixing)return;showHeard(e.results);lastSound=Date.now();
        var toks=roundTokens(e.results);roundToks=toks;var r=align(toks,W,anchor);
        if(r.p>best){best=r.p;lastProg=Date.now();trailAt=0;paint(best);}
        if(best>=W.length){finished();return;}
        if(e.results[e.results.length-1].isFinal){
          if(r.problem>=0&&r.problem>=best-1){problem(Math.max(r.problem,best),true);return;}
          noise=r.trail;if(r.trail>0&&!trailAt)trailAt=Date.now();}};
      rec.onerror=function(ev){if(fatal(ev.error))micFail();};
      rec.onend=function(){setGo(false);
        if(roundToks){var r=align(roundToks,W,anchor);committed=(r.p>=best?roundToks.slice(r.k):[]).slice(-4);anchor=best;}
        if(!listening||fixing)return;if($('#stmt'))setTimeout(startListen,40);};
      try{rec.start();}catch(e){micFail();return;}
      clearInterval(STALL);STALL=setInterval(function(){if(!listening||fixing||!$('#stmt'))return;var now=Date.now(),rx=relaxed();
        if(now-lastProg>8000)showReadIt();
        if(trailAt&&noise>0&&now-trailAt>(rx?2600:1800)){trailAt=0;problem(best,false);return;}
        if(lastSound>lastProg&&now-lastProg>(rx?7000:5000)){problem(best,false);return;}
        if(now-lastProg>9000&&lastSound<=lastProg)setStatus('I can’t hear you yet. Hold the phone close and read a little louder.');},300);}
    /* real=true: she said a different word. real=false: the phone just couldn't catch it, so no penalty. */
    function problem(i,real){if(fixing)return;while(i<W.length-1&&TINY[W[i]]){i++;}if(i>best){best=i;anchor=i;committed=[];}fixing=true;listening=false;stopAll();setGo(false);paint(i);var w=words[i].replace(/[“”".,!?]/g,'');
      if(real){sentMiss++;sk.missed[w.toLowerCase()]=(sk.missed[w.toLowerCase()]||0)+1;SFX.nudge();}
      spans[i].classList.add('stuck');
      ctrl.innerHTML='<p style="font-size:20px;margin:0">'+(real?'Let’s read this one again:':'Read this word to me:')+'</p><button class="fixword" id="fw">'+esc(w)+'</button><p class="status" id="status">Get ready…</p>';
      $('#fw').onclick=function(){say(w,{rate:.75});};
      var tries=0;
      function listenWord(){var r2;try{r2=new SR();}catch(e){micFail();return;}r2.lang='en-US';r2.continuous=false;r2.interimResults=true;r2.maxAlternatives=5;liveRecs.push(r2);var got=false;
        r2.onaudiostart=function(){if(!got)setStatus('Go! Say it now.');};
        r2.onresult=function(e){var hit=false;showHeard(e.results);for(var k=0;k<e.results.length&&!hit;k++)for(var a=0;a<e.results[k].length&&!hit;a++){
            var tk=tokensOf(e.results[k][a].transcript);
            for(var z=0;z<tk.length&&!hit;z++)hit=looseMatch(tk[z],W[i])||(z+1<tk.length&&looseMatch(tk[z]+tk[z+1],W[i]))||(i+1<W.length&&looseMatch(tk[z],W[i]+W[i+1]));}
          if(hit&&!got){got=true;try{r2.abort();}catch(er){}ok(false);}};
        r2.onerror=function(ev){if(fatal(ev.error))micFail();};

      function ok(gaveUp){fixing=false;trailAt=0;noise=0;spans[i].classList.remove('stuck');spans[i].classList.add('fixed');if(!gaveUp)SFX.good();
        best=Math.max(best,i+1);anchor=best;committed=[];lastProg=Date.now();lastSound=0;helpShown=false;
        if(best>=W.length){finished();return;}
        ctrl.innerHTML='<button class="mic live" id="micBtn" aria-label="Listening">🎙️</button><p class="status" id="status">'+(gaveUp?'Let’s keep going!':'Nice! Keep reading from the next word.')+'</p><div id="assist"></div>';
        $('#micBtn').onclick=pauseOrGo;paint(best);setTimeout(startListen,100);}
      setTimeout(listenWord,100);}

    $('#micBtn').onclick=pauseOrGo;
  }
  render();}

var MM_WORDS={cat:'🐱',dog:'🐶',sun:'☀️',hat:'🎩',fish:'🐟',duck:'🦆',frog:'🐸',cake:'🎂',tree:'🌳',boat:'⛵',star:'⭐',moon:'🌙',bear:'🐻',apple:'🍎',house:'🏠',train:'🚂',snake:'🐍',robot:'🤖',rocket:'🚀',pencil:'✏️',rabbit:'🐰',penguin:'🐧',dinosaur:'🦕',umbrella:'☂️',octopus:'🐙',volcano:'🌋',telescope:'🔭',butterfly:'🦋'};
function gameMemory(){stage.innerHTML='<div class="st-head"><span class="tag">🃏 Memory Match</span></div><p class="line1">Pick your cards:</p>'+
   '<div class="choices" style="max-width:460px"><button class="choice mm-mode" data-m="math" style="font-size:24px">🔢 Math</button><button class="choice mm-mode" data-m="words" style="font-size:24px">🔤 Words</button></div>';
  $$('.mm-mode').forEach(function(b){b.onclick=function(){SFX.tap();playMemory(b.dataset.m);};});}
function playMemory(mode){var pairs=[],seen={},g;
  if(mode==='math'){g=gr('math');var L=Math.min(2,S.skills.mult.lvl),k=0;while(pairs.length<6&&k<300){k++;var P=genMath(g,L);var ans=String(P.a),q=P.q.replace(' =','');if(seen[ans]||seen[q])continue;seen[ans]=seen[q]=1;pairs.push([q,ans]);}}
  else{g=gr('read');var all=Object.keys(MM_WORDS).filter(function(w){return g<=1?w.length<=4:g<=3?w.length<=6:w.length>=4;});shuffle(all).slice(0,6).forEach(function(w){pairs.push([w,MM_WORDS[w]]);});}
  var cards=[];pairs.forEach(function(p,i){cards.push({t:p[0],id:i,kind:'a'});cards.push({t:p[1],id:i,kind:'b'});});cards=shuffle(cards);
  stage.innerHTML='<div class="st-head"><span class="tag">🃏 Memory Match</span><span class="timer" id="mv">0 flips</span></div><p class="line1">Find the pairs!</p>'+
   '<div class="mm-grid">'+cards.map(function(c,i){return '<button class="mm-card" data-i="'+i+'" aria-label="card"><span class="mm-back">?</span><span class="mm-face'+(mode==='words'&&c.kind==='b'?' emoji':'')+'">'+esc(c.t)+'</span></button>';}).join('')+'</div>';
  var open=[],found=0,moves=0,lock=false,els=$$('.mm-card');
  els.forEach(function(el){el.onclick=function(){if(lock)return;var i=+el.dataset.i;if(el.classList.contains('flip'))return;el.classList.add('flip');SFX.type();
    if(mode==='words'&&cards[i].kind==='a')say(cards[i].t,{rate:.85});
    open.push(i);if(open.length<2)return;moves++;$('#mv').textContent=moves+' flips';var a=cards[open[0]],b=cards[open[1]];
    if(a.id===b.id){found++;SFX.good();var pts=Math.max(5,20-Math.max(0,moves-found)*1);C.points+=pts;$('#pts').textContent=C.points;floatPts('+'+pts,el);
      open.forEach(function(j){els[j].classList.add('done');});open=[];meterPct(found/pairs.length*100);
      if(found>=pairs.length){var extra=moves-pairs.length;setTimeout(function(){arcadeEnd('memory',C.points,['🃏 You matched all <b>'+pairs.length+' pairs</b> in <b>'+moves+' flips</b>',mode==='math'?'🔢 Math pairs: <b>'+pairs.map(function(p){return esc(p[0]+' = '+p[1]);}).join(', ')+'</b>':'🔤 Words: <b>'+pairs.map(function(p){return esc(p[0]);}).join(', ')+'</b>'],extra<=3?3:extra<=8?2:1);},700);}}
    else{lock=true;SFX.nudge();setTimeout(function(){open.forEach(function(j){els[j].classList.remove('flip');});open=[];lock=false;},850);}};});}

  stage.innerHTML='<div class="center" style="padding-top:10px"><div style="font-size:48px">🔒</div><h1 class="big" style="font-size:28px;margin:0">Grown-ups only</h1><p class="line1">'+(why||'Enter the 4-digit PIN to unlock.')+'</p>'+

   '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 class="h2" style="margin:0">GRADE LEVELS</h2>'+
   '<p style="margin:0;color:var(--muted);font-size:15px">Only you can change these, and grade numbers never show up on her screens. Each grade has 3 steps that move up and down on their own as she plays.</p>'+
   [['math','Math','facts, sharing & division'],['spell','Spelling','passwords, word hunt, word games'],['read','Reading','witness statements & clues']].map(function(r){var cur=gr(r[0]);
     return '<div class="grow"><div><b>'+r[1]+'</b><span>'+r[2]+'</span></div><div class="gbtns" role="group" aria-label="'+r[1]+' grade">'+[1,2,3,4,5].map(function(n){return '<button class="gb'+(n===cur?' on':'')+'" data-k="'+r[0]+'" data-g="'+n+'" aria-pressed="'+(n===cur)+'">'+n+'</button>';}).join('')+'</div></div>';}).join('')+
   '</section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:14px"><label class="toggle" for="nm">Detective name <input type="text" id="nm" value="'+esc(S.name)+'" maxlength="20"></label>'+
   '<label class="toggle"><input type="checkbox" id="micT" '+(S.mic?'checked':'')+' style="width:26px;height:26px"> Use the microphone to check reading '+(SR?'':'<span style="color:var(--muted)">(this browser can’t listen; use Chrome)</span>')+'</label>'+
   '<div class="toggle" role="group" aria-label="Mic pickiness"><span>Mic pickiness</span><button class="btn '+(relaxed()?'':'alt')+'" id="mmR" style="min-height:44px;font-size:16px;padding:6px 14px">Relaxed</button><button class="btn '+(relaxed()?'alt':'')+'" id="mmS" style="min-height:44px;font-size:16px;padding:6px 14px">Strict</button></div>'+
   '<label class="toggle"><input type="checkbox" id="dbgT" '+(S.micDebug?'checked':'')+' style="width:26px;height:26px"> Show what the mic hears while she reads</label>'+
   (SR?'<div style="display:flex;flex-direction:column;gap:8px"><div class="row"><button class="btn alt" id="micTest" style="min-height:48px;font-size:17px">🎙️ Mic check</button><span style="color:var(--muted);font-size:15px">Tap, then say a sentence. You’ll see exactly what the phone heard.</span></div><p class="heard" id="micTestOut" style="text-align:left;font-size:16px;color:var(--text)"></p></div>':'')+
   '<p style="margin:0;color:var(--muted);font-size:14px">Relaxed lets her read at a normal speed and forgives words the mic misses. Strict stops her on every skipped or slightly-off word.</p>'+
   '<p style="margin:0;color:var(--muted);font-size:15px">Arcade: '+(ARCADE.map(function(g){var r=(S.arcade||{})[g.id];return r?g.name+' (played '+r.plays+'×, best '+r.best+')':null;}).filter(Boolean).join(' · ')||'not played yet')+'</p>'+

  wireGrownTabs();

/* ================= backup codes ================= */
function ckSum(s){var n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))%9973;return n;}
function makeBackup(){var o=JSON.parse(JSON.stringify(S));o.archive=(o.archive||[]).slice(-20);if(o.wallet&&o.wallet.log)o.wallet.log=o.wallet.log.slice(-80);
  Object.keys(o.skills||{}).forEach(function(k){var m=o.skills[k].missed||{};var n={};Object.keys(m).sort(function(a,b){return m[b]-m[a];}).slice(0,15).forEach(function(x){n[x]=m[x];});o.skills[k].missed=n;});
  o.v=VERSION;var b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'CF1-'+b+'-'+ckSum(b);}
function readBackup(code){var c=String(code||'').replace(/\s+/g,'');var m=/^CF1-([A-Za-z0-9_-]+)-(\d+)$/.exec(c);if(!m)return null;
  var b=m[1];if(ckSum(b)!==+m[2])return null;
  try{b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||typeof o!=='object'||!o.skills||typeof o.cases!=='number')return null;delete o.v;return o;}catch(e){return null;}}

renderHome();
