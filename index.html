<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Case Files Detective</title>
<meta name="theme-color" content="#121a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Case Files">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&family=Special+Elite&display=swap">
<style>
/* Layout: one-screen game. Thin HUD strip on top, one stage below. World = a detective's corkboard at night: navy board, manila case files, pink pushpin string. */
:root{
  --bg:#121a36; --board:#1b2550; --board2:#232f63; --line:#34407a;
  --paper:#f4e9cc; --paper2:#e9dbb4; --paper-ink:#2b2416;
  --text:#eef1ff; --muted:#a8b2de;
  --hi:#ffe14d; --pin:#ff5c8a; --good:#3ee6a8; --nudge:#ffb547;
  --f-display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-type:'Special Elite','Courier New',Courier,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.4;
  background-image:radial-gradient(circle at 20% 0%,#1e2a5c 0,transparent 55%),radial-gradient(circle at 100% 100%,#24184a 0,transparent 50%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
#app{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hud[hidden]{display:none!important}
.hbtn{min-width:48px;height:48px;border-radius:14px;background:var(--board2);border:2px solid var(--line);font-size:20px;display:grid;place-items:center;padding:0 10px}
.hcase{font-family:var(--f-type);color:var(--muted);font-size:15px}
.meter{flex:1 1 140px;height:16px;border-radius:99px;background:var(--board);border:2px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pin),var(--hi));transition:width .5s cubic-bezier(.3,1.4,.6,1);border-radius:99px}
.pts{font-family:var(--f-display);font-size:22px;color:var(--hi);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.flame{font-family:var(--f-display);font-size:18px;color:var(--nudge);min-width:44px;text-align:center;transition:transform .2s}
.flame.pop{transform:scale(1.5)}

/* generic */
.card{background:var(--board);border:2px solid var(--line);border-radius:20px;padding:18px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 20px;box-shadow:0 10px 0 -4px var(--paper2),0 14px 30px rgba(0,0,0,.4);position:relative}
.paper::before{content:"";position:absolute;top:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pin);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 3px 4px rgba(0,0,0,.4)}
.big{font-family:var(--f-display);letter-spacing:.02em;text-wrap:balance;line-height:1.05}
.typed{font-family:var(--f-type)}
.btn{min-height:64px;border-radius:18px;padding:12px 26px;font-weight:800;font-size:22px;background:var(--hi);color:#1b1b2a;box-shadow:0 6px 0 #b89b10;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b89b10}
.btn.alt{background:var(--board2);color:var(--text);box-shadow:0 6px 0 #0c1230;border:2px solid var(--line)}
.btn.pink{background:var(--pin);color:#fff;box-shadow:0 6px 0 #a8204a}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.line1{font-size:20px;color:var(--muted);text-align:center;margin:0}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-family:var(--f-display);font-size:20px;color:var(--hi)}
.pips{display:flex;gap:6px}
.pips b{width:16px;height:16px;border-radius:50%;background:var(--board2);border:2px solid var(--line);transition:background .3s,transform .3s}
.pips b.on{background:var(--good);border-color:var(--good);transform:scale(1.15)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.badge-big{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--hi),var(--nudge),var(--hi));display:grid;place-items:center;box-shadow:0 0 0 6px var(--board2),0 0 0 9px var(--hi);animation:spin 18s linear infinite}
.badge-big span{font-size:52px;animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.rank{font-family:var(--f-type);color:var(--pin);font-size:18px;text-transform:uppercase;letter-spacing:.12em}
.title{font-size:clamp(34px,8vw,58px);margin:4px 0;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--board2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:26px;color:var(--hi);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bdg{background:var(--board2);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;color:var(--muted);border:2px dashed var(--line)}
.bdg i{display:block;font-style:normal;font-size:34px;filter:grayscale(1) brightness(.5)}
.bdg.got{border:2px solid var(--hi);color:var(--text)}
.bdg.got i{filter:none}
.h2{font-family:var(--f-display);font-size:18px;color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
.archive{display:flex;flex-direction:column;gap:8px}
.arc{display:flex;justify-content:space-between;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:8px 12px;font-family:var(--f-type);font-size:15px}
.arc b{color:#b3123f}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.suspect{background:#fbf8ef;color:var(--paper-ink);border-radius:6px;padding:8px 8px 10px;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));transition:transform .2s,outline-color .2s;position:relative;outline:4px solid transparent;min-width:0}
.suspect:nth-child(1){--r:-2deg}.suspect:nth-child(2){--r:1.5deg}.suspect:nth-child(3){--r:-1deg}
.suspect .av{font-size:46px;background:#cfd7f2;border-radius:4px;padding:4px 0}
.suspect .nm{font-weight:800;font-size:18px;margin:4px 0}
.chips{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.chip{font-size:13px;background:#ece4cf;border-radius:8px;padding:2px 6px;display:flex;align-items:center;gap:5px;justify-content:center;transition:background .3s}
.chip.bad{background:var(--nudge)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--sw);border:1px solid rgba(0,0,0,.3)}
.suspect.out{opacity:.45}
.suspect.out::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:110px;color:#b3123f;font-family:var(--f-display);pointer-events:none}
.suspect.sel{outline-color:var(--hi);transform:rotate(0) scale(1.04)}
.suspect.mini .av{font-size:34px}.suspect.mini .nm{font-size:15px}.suspect.mini .chip{font-size:11px}
.pop-in{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.4) rotate(-8deg);opacity:0}}

/* board */
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sta{background:var(--board2);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:14px;color:var(--muted)}
.sta i{display:block;font-style:normal;font-size:32px}
.sta.done{border-color:var(--good);color:var(--good)}
.sta.next{border-color:var(--hi);color:var(--text);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,225,77,.25)}}
.notebook{display:flex;flex-direction:column;gap:10px}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px 14px;font-size:18px;display:flex;gap:10px;align-items:baseline;transition:background .3s}
.clue b{font-family:var(--f-type);color:#b3123f;white-space:nowrap}
.clue.flag{background:var(--nudge)}
.clue.empty{background:transparent;border:2px dashed var(--line);color:var(--muted)}

/* safe */
.safe{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(160deg,#4a557f,#2b3360);border-radius:22px;padding:18px;border:4px solid #6c78a8;box-shadow:inset 0 0 0 6px #232a4f}
.dial{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#cfd5ea 0 30%,#8792bb 31% 60%,#59638f 61%);position:relative;transition:transform .5s cubic-bezier(.3,1.5,.5,1);box-shadow:0 4px 0 #1b2147}
.dial::after{content:"";position:absolute;top:6px;left:50%;width:6px;height:18px;margin-left:-3px;background:var(--pin);border-radius:3px}
.lcd{background:#0b1f17;border-radius:12px;padding:12px 16px;font-family:var(--f-display);font-size:clamp(34px,8vw,52px);color:#7dffc4;text-shadow:0 0 12px rgba(125,255,196,.6);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;min-width:0}
.lcd .ans{min-width:1.6em;border-bottom:4px solid #7dffc4;text-align:center}
.lights{grid-column:1/-1;display:flex;gap:10px;justify-content:center}
.lights b{width:22px;height:22px;border-radius:50%;background:#3a1630;border:3px solid #1b2147;transition:background .3s,box-shadow .3s}
.lights b.on{background:var(--good);box-shadow:0 0 14px var(--good)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.key{height:68px;border-radius:16px;background:var(--board2);border:2px solid var(--line);font-family:var(--f-display);font-size:28px;box-shadow:0 5px 0 #0c1230}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #0c1230}
.key.go{background:var(--good);color:#0b2a1e;border-color:var(--good);box-shadow:0 5px 0 #1d8a63}
.wobble{animation:wob .45s}
@keyframes wob{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.hintbox{background:rgba(255,181,71,.12);border:2px solid var(--nudge);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.hintbox p{margin:0;font-size:19px}
.skip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.skip span{background:var(--nudge);color:#2a1a00;border-radius:10px;padding:4px 10px;font-weight:800;font-size:20px;animation:popin .3s both}
.dots{display:grid;gap:5px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--hi);display:block;animation:popin .3s both}

/* split */
.eq{font-family:var(--f-display);font-size:clamp(40px,10vw,64px);text-align:center;color:var(--hi);margin:0}
.loot{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:520px;margin:0 auto}
.loot i{width:16px;height:16px;border-radius:50%;background:var(--hi);display:block;transition:opacity .3s}
.bags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bag{min-width:74px;min-height:74px;border-radius:14px 14px 26px 26px;background:#7b5a2e;border:3px solid #a57a3e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;color:#fff3cf}
.bag .bdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:64px}
.bag .bdots i{width:10px;height:10px;border-radius:50%;display:block;animation:popin .3s both}
.bag b{font-family:var(--f-display);font-size:22px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px;margin:0 auto;width:100%}
.choice{min-height:78px;border-radius:18px;background:var(--board2);border:3px solid var(--line);font-family:var(--f-display);font-size:34px;box-shadow:0 5px 0 #0c1230}
.choice.glow{border-color:var(--hi);animation:pulse 1s infinite}
.choice.dim{opacity:.35}
.choice.right{background:var(--good);color:#0b2a1e;border-color:var(--good)}

/* code breaker */
.hear{width:96px;height:96px;border-radius:50%;background:var(--pin);font-size:42px;box-shadow:0 6px 0 #a8204a;display:grid;place-items:center}
.hear:active{transform:translateY(4px);box-shadow:0 2px 0 #a8204a}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:64px;border-radius:10px;background:#0b1f17;border:3px solid #2c6b52;font-family:var(--f-display);font-size:34px;color:#7dffc4;display:grid;place-items:center;text-transform:lowercase}
.slot.cur{border-color:var(--hi)}
.slot.filled{animation:popin .25s both}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:560px;margin:0 auto}
.tile{width:64px;height:68px;border-radius:12px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-type);font-size:38px;box-shadow:0 5px 0 var(--paper2)}
.tile.used{visibility:hidden}
.tile.glow{background:var(--hi);animation:pulse .9s infinite}

/* witness */
.statement{font-size:clamp(26px,6vw,36px);line-height:1.6;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;text-align:center}
.w{padding:0 4px;border-radius:8px;transition:background .25s,color .25s;cursor:pointer;border-bottom:3px solid transparent}
.w.ok{background:var(--good);color:#0b2a1e}
.w.now{border-bottom-color:var(--hi)}
.w.stuck{background:var(--nudge);color:#2a1a00;animation:pulse 1s infinite}
.w.fixed{background:#9ff3d0;color:#0b2a1e}
.w.find{background:var(--hi);color:#1b1b2a}
.mic{width:110px;height:110px;border-radius:50%;background:var(--pin);font-size:48px;display:grid;place-items:center;box-shadow:0 6px 0 #a8204a}
.mic.live{animation:live 1.2s ease-in-out infinite}
@keyframes live{50%{box-shadow:0 0 0 18px rgba(255,92,138,.25),0 6px 0 #a8204a}}
.status{font-size:18px;color:var(--muted);min-height:1.4em;text-align:center;margin:0}
.fixword{font-family:var(--f-display);font-size:clamp(44px,12vw,72px);color:var(--nudge);background:none}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}

/* clue reveal + end */
.reveal .paper{max-width:520px;width:100%;transform:rotate(-1.5deg);animation:slidein .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes slidein{from{transform:translateY(60px) rotate(8deg);opacity:0}}
.clue-no{font-family:var(--f-type);color:#b3123f;font-size:18px;letter-spacing:.1em}
.clue-text{font-size:clamp(24px,6vw,32px);font-weight:600;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:center}
.clue-text .w{cursor:pointer}
.stamp{font-family:var(--f-display);font-size:clamp(40px,11vw,76px);color:var(--pin);border:8px solid var(--pin);border-radius:14px;padding:6px 18px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;text-align:center;line-height:1}
@keyframes stamp{from{transform:scale(3) rotate(-20deg);opacity:0}}
.tally{font-family:var(--f-display);font-size:48px;color:var(--hi);font-variant-numeric:tabular-nums}
.learned{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.learned div{background:var(--board2);border-radius:12px;padding:10px 14px;font-size:17px}
.confess{font-family:var(--f-type);font-size:20px;color:var(--paper-ink)}

/* grown-up */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
input[type=text]{font:inherit;font-size:18px;background:var(--board2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
.toggle{display:flex;gap:10px;align-items:center;font-size:17px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--hi);color:#1b1b2a;font-weight:800;padding:12px 20px;border-radius:16px;transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:20;max-width:calc(100% - 32px);text-align:center;font-size:18px}
#toast.show{transform:translate(-50%,0)}
.floater{position:fixed;font-family:var(--f-display);color:var(--hi);font-size:26px;pointer-events:none;animation:floatup .9s ease-out forwards;z-index:15}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:14;width:100%;height:100%}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stations{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .safe{grid-template-columns:1fr;justify-items:center}
  .dial{width:72px;height:72px}
  .suspects{gap:6px}
  .suspect .av{font-size:36px}
  .chip{font-size:11px;padding:2px 3px}
  .tile{width:56px;height:62px;font-size:32px}
  .slot{width:42px;height:56px;font-size:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<canvas id="fx"></canvas>
<div id="app">
  <header id="hud" hidden>
    <button class="hbtn" id="homeBtn" aria-label="Back to case files">🗂️</button>
    <span class="hcase" id="hcase"></span>
    <div class="meter" aria-label="Case progress"><i id="meterFill"></i></div>
    <span class="flame" id="flame" title="Streak">🔥0</span>
    <span class="pts" id="pts">0</span>
    <button class="hbtn" id="muteBtn" aria-label="Sound effects on or off">🔊</button>
  </header>
  <main id="stage"></main>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ================= storage ================= */
var KEY='caseFilesDetective.v1';
function defSkill(){return {lvl:1,att:0,first:0,run:0,missRun:0,missed:{}};}
function defaults(){return {name:'',cases:0,points:0,bestCase:0,badges:[],archive:[],
  skills:{mult:defSkill(),div:defSkill(),spell:defSkill(),read:defSkill()},
  wordsRead:0,bestStreak:0,dayStreak:0,lastDay:'',muted:false,mic:true,caseNo:0};}
var S=defaults();
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);var d=defaults();S=Object.assign(d,o);S.skills=Object.assign(defaults().skills,o.skills||{});}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= helpers ================= */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var stage=$('#stage');
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

/* ================= sound ================= */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}

function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function match(heard,target){if(!heard)return false;if(heard===target)return true;if(HOMO[target]&&HOMO[target].indexOf(heard)>=0)return true;

/* walk heard words against the sentence. Returns how far she got, and where she slipped (if anywhere). */
function align(heard,W,start){var p=start,miss=0,problem=-1;
  for(var k=0;k<heard.length;k++){var t=heard[k];if(p>=W.length)break;
    if(match(t,W[p])){p++;miss=0;continue;}
    if(TINY[W[p]]&&p+1<W.length&&match(t,W[p+1])){p+=2;miss=0;continue;}
    if(p+1<W.length&&match(t,W[p+1])){problem=p;break;}
    if(p+2<W.length&&match(t,W[p+2])&&!TINY[W[p]]){problem=p;break;}
    miss++;if(miss>=2){problem=p;break;}
  }
  return {p:p,problem:problem,trail:miss};}

function makeCase(){S.caseNo++;
  var setting=SETTINGS[(S.caseNo-1)%SETTINGS.length];
  var order=shuffle(['mult','div','spell','read']);
  var attrs=shuffle(ATTRS);
  var people=shuffle(PEOPLE).slice(0,3);var sus,cul;
  for(var tries=0;tries<800;tries++){
    sus=people.map(function(p){var t={};ATTRS.forEach(function(k){t[k]=pick(TR[k].vals);});return {name:p[0],av:p[1],t:t};});
    cul=sus[0];
    var fits=function(s,k){return attrs.slice(0,k).every(function(a){return s.t[a]===cul.t[a];});};
    var others=sus.slice(1);
    if(others.some(function(o){return fits(o,4);}))continue;
    if(!others.some(function(o){return fits(o,2);}))continue;
    break;}
  var stations=order.map(function(type,i){var a=attrs[i],v=cul.t[a];
    var st={type:type,attr:a,done:false};
    if(type==='read'){st.flavor=pick(FLAVOR).replace('{place}',setting.place);st.wit=TR[a].wit(v);st.clue='Witness: “'+st.wit+'”';}
    else st.clue=TR[a].clue(v);
    return st;});
  return {no:S.caseNo,setting:setting,stations:stations,suspects:shuffle(sus),culprit:cul,points:0,hints:0,streak:0,qsDone:0,
    learned:{mult:[],div:[],spell:[],read:0},levelUps:[],clues:[],closed:false};}
function startCase(){var t=todayStr();if(S.lastDay!==t){var y=new Date();y.setDate(y.getDate()-1);S.dayStreak=(S.lastDay===todayStr(y))?S.dayStreak+1:1;S.lastDay=t;}
  C=makeCase();persist();shownPts=0;$('#pts').textContent='0';setHUD(true);$('#hcase').textContent='CASE #'+String(C.no).padStart(3,'0');setFlame();setMeter();renderIntro();}

  var a,b,missing,answer,typed='',tries=0,rot=0;

      if(L===1){x=pick([1,2,5,2,5,3]);y=rnd(1,5);}else if(L===2){x=rnd(2,5);y=rnd(1,10);}else{x=rnd(2,5);y=rnd(2,10);missing=Math.random()<.5;}

  function check(){if(!typed)return;var v=+typed;var tbl=a<=5?a:b,times=a<=5?b:a;var prod=a*b;

      return;}

    if(missing){tbl=a;times=answer;}

    if(tries===1){$('#hint').innerHTML='<div class="hintbox"><p>So close! Count by '+tbl+'s, '+times+' times:</p><div class="skip">'+skip+'</div></div>';}
    else{var dots='<div class="dots" style="grid-template-columns:repeat('+Math.max(tbl,1)+',14px)">';for(var j=0;j<tbl*times;j++)dots+='<i style="animation-delay:'+(j*.02)+'s"></i>';dots+='</div>';
      $('#hint').innerHTML='<div class="hintbox"><p>The code is <b style="font-size:28px;color:var(--hi)">'+answer+'</b>. Type it in!</p>'+(missing?'':dots)+'</div>';}}

/* ================= SPLIT THE LOOT (÷) ================= */
function divStation(done){var sk=S.skills.div,n=0,total=3,seen={};var loot=C.setting.loot;

  function answer(bt,v){if(v===q){SFX.good();bt.classList.add('right');fillBags('show');n++;pip(n);C.learned.div.push(N+' ÷ '+d+' = '+q);result('div',tries===0,N+'÷'+d,bt);
      $$('#ch .choice').forEach(function(c){c.disabled=true;});

/* ================= CODE BREAKER (spelling) ================= */
function spellStation(done){var sk=S.skills.spell,n=0,total=3;var pool=shuffle(WORDS[sk.lvl]);var used={};
  stage.innerHTML=stationHead('spell',total)+'<p class="line1">Listen. Build the secret password.</p><div class="center"><button class="hear" id="hear" aria-label="Hear the password">🔊</button></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div id="hint"></div>';

/* ================= WITNESS (reading aloud) ================= */
var liveRecs=[];
function stopAllMic(){liveRecs.forEach(function(r){try{r.onend=null;r.onresult=null;r.onerror=null;r.abort();}catch(e){}});liveRecs=[];}
function readStation(st,done){var sk=S.skills.read;var sents=[st.flavor,st.wit],si=0;
  function render(){stopAllMic();var text=sents[si];var words=text.split(' ');var W=words.map(normWord);var mic=micOn();var sentMiss=0;
    stage.innerHTML=stationHead('read',2)+'<p class="line1">'+(mic?'Tap the mic. Read the witness statement out loud.':'Read it out loud. Tap a word to hear it.')+'</p>'+
      '<div class="paper"><div class="clue-no">WITNESS STATEMENT '+(si+1)+' of 2</div><div class="statement" id="stmt">'+wordsHTML(text)+'</div></div>'+
      '<div class="center" id="ctrl"></div>';
    for(var x=0;x<si;x++)pip(x+1);
    hookHear($('#stmt'));var spans=$$('#stmt .w');var ctrl=$('#ctrl');
    function paint(p){spans.forEach(function(s,i){if(s.classList.contains('fixed'))return;s.classList.toggle('ok',i<p);s.classList.toggle('now',i===p);});}
    function finished(){stopAllMic();paint(words.length);SFX.good();S.wordsRead+=words.length;C.learned.read+=words.length;
      result('read',sentMiss===0,null,$('#stmt'));pip(si+1);
      ctrl.innerHTML='<div class="big" style="color:var(--good);font-size:26px">Got it!</div>';
      setTimeout(function(){if(si<1){si++;render();}else done();},1100);}

    if(!mic){ctrl.innerHTML='<button class="btn big" id="did">I read it!</button>'+(SR&&!micBroken&&!S.mic?'':'');
      $('#did').onclick=function(){SFX.tap();if(si<1){S.wordsRead+=words.length;C.learned.read+=words.length;pip(1);si++;render();}else quiz();};
      function quiz(){var a=st.attr,v=C.culprit.t[a];var opts=shuffle([v].concat(shuffle(TR[a].vals.filter(function(x){return x!==v;})).slice(0,2)));var tries=0;
        ctrl.innerHTML='<p style="font-size:22px;font-weight:800;margin:0">'+esc(TR[a].q)+'</p><div class="choices" id="qz"></div><div id="qh"></div>';
        opts.forEach(function(o){var b=document.createElement('button');b.className='choice';b.style.fontFamily='var(--f-body)';b.style.fontSize='22px';b.innerHTML=TR[a].ans(o);b.onclick=function(){
          if(o===v){SFX.good();b.classList.add('right');S.wordsRead+=words.length;C.learned.read+=words.length;result('read',tries===0,null,b);pip(2);setTimeout(done,900);}
          else{tries++;SFX.nudge();b.classList.add('dim');b.disabled=true;var key=normWord(String(v));spans.forEach(function(s){var w=normWord(s.textContent);if(w===key||w.indexOf(key.slice(0,4))===0)s.classList.add('find');});$('#qh').innerHTML='<div class="hintbox"><p>Look at the yellow word!</p></div>';}};$('#qz').appendChild(b);});}
      return;}

    /* --- mic mode --- */
    var p=0,best=0,listening=false,fixing=false,rec=null;
    ctrl.innerHTML='<button class="mic" id="micBtn" aria-label="Start reading">🎙️</button><p class="status" id="status">Tap the mic, then read.</p><button class="link" id="noMic">Mic not working? Read without it</button>';
    $('#noMic').onclick=function(){micBroken=true;stopAllMic();toast('Okay! Tap mode is on.');render();};
    paint(0);
    function fatal(err){return ['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].indexOf(err)>=0;}
    function micFail(){micBroken=true;stopAllMic();toast('Mic is off here, so we switched to tap mode.');setTimeout(render,600);}
    function setStatus(t){var s=$('#status');if(s)s.textContent=t;}
    function startListen(){if(fixing)return;stopAllMic();var start=p;
      try{rec=new SR();}catch(e){micFail();return;}
      rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;liveRecs.push(rec);listening=true;
      var mb=$('#micBtn');if(mb)mb.classList.add('live');setStatus('Listening… read the yellow-lined word next.');
      rec.onresult=function(e){var txt='';for(var i=0;i<e.results.length;i++)txt+=' '+e.results[i][0].transcript;
        var last=e.results[e.results.length-1].isFinal;
        var heard=txt.split(/\s+/).map(normWord).filter(function(t){return t&&!FILLER[t];});
        var r=align(heard,W,start);paint(r.p);
        if(r.p>=W.length){finished();return;}
        if(last){best=r.p;if(r.problem>=0)problem(r.problem);else if(r.trail>=1)problem(r.p);}};
      rec.onerror=function(ev){if(fatal(ev.error))micFail();};
      rec.onend=function(){if(!listening||fixing)return;p=best;setTimeout(function(){if(listening&&!fixing&&$('#stmt'))startListen();},150);};
      try{rec.start();}catch(e){micFail();}}
    function problem(i){fixing=true;listening=false;stopAllMic();p=i;paint(i);sentMiss++;var w=words[i].replace(/[“”".,!?]/g,'');
      sk.missed[w.toLowerCase()]=(sk.missed[w.toLowerCase()]||0)+1;spans[i].classList.add('stuck');SFX.nudge();
      $('#micBtn').classList.remove('live');
      ctrl.innerHTML='<p style="font-size:20px;margin:0">Let’s read this one again:</p><button class="fixword" id="fw">'+esc(w)+'</button><p class="status" id="status">Say it now…</p>';
      $('#fw').onclick=function(){say(w,{rate:.75});};
      var tries=0;
      function listenWord(){var r2;try{r2=new SR();}catch(e){micFail();return;}r2.lang='en-US';r2.continuous=false;r2.interimResults=true;liveRecs.push(r2);var got=false;
        r2.onresult=function(e){var t='';for(var k=0;k<e.results.length;k++)t+=' '+e.results[k][0].transcript;if(t.split(/\s+/).map(normWord).some(function(x){return match(x,W[i]);})){got=true;try{r2.abort();}catch(er){}ok(false);}};
        r2.onerror=function(ev){if(fatal(ev.error))micFail();};
        r2.onend=function(){if(got||!fixing)return;tries++;
          if(tries===1){setStatus('Here’s how it sounds. Now you say it!');say(w,{rate:.75,onend:function(){setTimeout(listenWord,300);}});}
          else if(tries<4){setStatus('Try once more…');listenWord();}
          else ok(true);};
        try{r2.start();}catch(e){micFail();}}
      function ok(gaveUp){fixing=false;spans[i].classList.remove('stuck');spans[i].classList.add('fixed');if(!gaveUp)SFX.good();p=i+1;best=p;
        if(p>=W.length){finished();return;}
        ctrl.innerHTML='<button class="mic live" id="micBtn" aria-label="Listening">🎙️</button><p class="status" id="status">'+(gaveUp?'Let’s keep going!':'Nice! Keep reading from the next word.')+'</p>';
        $('#micBtn').onclick=function(){};paint(p);setTimeout(startListen,250);}
      setTimeout(listenWord,250);}
    $('#micBtn').onclick=function(){ac();if(listening){listening=false;stopAllMic();$('#micBtn').classList.remove('live');setStatus('Paused. Tap the mic to keep going.');}else startListen();};
  }
  render();}

  var cul=C.culprit;
  stage.innerHTML='<div class="center" style="padding-top:10px"><div class="stamp">CASE<br>CLOSED</div>'+
    '<div class="paper center" style="max-width:520px;width:100%;gap:6px"><div style="font-size:54px">'+cul.av+'</div><div style="font-weight:800;font-size:22px">'+esc(cul.name)+' did it!</div><div class="confess">“'+esc(C.setting.confess)+'”</div></div>'+
    '<div><div class="tally" id="tally">0</div><div class="line1">points'+(pb?' · NEW PERSONAL BEST!':'')+'</div></div>'+
    (news.length?'<div class="badges" style="width:100%">'+news.map(function(b){return '<div class="bdg got pop-in"><i>'+b[2]+'</i>NEW: '+esc(b[1])+'</div>';}).join('')+'</div>':'')+
    '<div class="learned"><div class="h2" style="margin:0">TODAY YOU LEARNED</div>'+items.map(function(t){return '<div>'+t+'</div>';}).join('')+'</div>'+
    '<div class="row" style="justify-content:center"><button class="btn alt" id="stop">💾 Save & stop</button><button class="btn" id="again">📂 Next case</button></div></div>';
  var t=0,target=C.points;(function up(){t+=Math.ceil((target-t)/10)||1;if(t>target)t=target;var el=$('#tally');if(el)el.textContent=t;if(t<target)requestAnimationFrame(up);})();
  if(news.length)setTimeout(function(){SFX.unlock();},900);
  $('#stop').onclick=function(){SFX.tap();renderHome();};$('#again').onclick=function(){SFX.tap();startCase();};}

/* ================= GROWN-UP REPORT ================= */
function renderGrown(){setHUD(false);
  var rows=['mult','div','spell','read'].map(function(k){var s=S.skills[k];var pct=s.att?Math.round(s.first/s.att*100)+'%':'–';
    var tough=Object.keys(s.missed).sort(function(a,b){return s.missed[b]-s.missed[a];}).slice(0,6).map(function(x){return esc(x)+' ('+s.missed[x]+')';}).join(', ')||'none yet';
    var nm={mult:'Times tables 1–5',div:'Division',spell:'Spelling',read:'Reading aloud'}[k];
    return '<tr><td><b>'+nm+'</b></td><td>'+(k==='read'?'–':s.lvl+' of 3<br><span style="color:var(--muted)">'+esc(LVL[k][s.lvl-1])+'</span>')+'</td><td>'+s.att+'</td><td>'+pct+'</td><td>'+tough+'</td></tr>';}).join('');
  stage.innerHTML='<div class="row" style="justify-content:space-between"><h1 class="big" style="font-size:28px;margin:0">Grown-up report</h1><button class="btn alt" id="back" style="min-height:52px;font-size:18px">← Back</button></div>'+
   '<section class="card"><p style="margin-top:0;color:var(--muted)">“First try” means she got it without a hint. The game aims for about 80%: it levels up after 4 first-try answers in a row and quietly eases off after 2 misses in a row.</p><div class="tablewrap"><table><thead><tr><th>Skill</th><th>Level</th><th>Tries</th><th>First try</th><th>Needed help with (times)</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
   '<section class="card" style="display:flex;flex-direction:column;gap:14px"><label class="toggle" for="nm">Detective name <input type="text" id="nm" value="'+esc(S.name)+'" maxlength="20"></label>'+
   '<label class="toggle"><input type="checkbox" id="micT" '+(S.mic?'checked':'')+' style="width:26px;height:26px"> Use the microphone to check reading '+(SR?'':'<span style="color:var(--muted)">(this browser can’t listen; use Chrome)</span>')+'</label>'+
   '<p style="margin:0;color:var(--muted);font-size:15px">Cases: '+S.cases+' · Total points: '+S.points+' · Best case: '+S.bestCase+' · Words read: '+S.wordsRead+'</p>'+
   '<div id="resetBox"><button class="link" id="reset">Reset all progress</button></div></section>';
  $('#back').onclick=renderHome;
  $('#nm').oninput=function(e){S.name=e.target.value.trim();persist();};
  $('#micT').onchange=function(e){S.mic=e.target.checked;micBroken=false;persist();};
  $('#reset').onclick=function(){$('#resetBox').innerHTML='<div class="row"><span>Erase every case, badge and score?</span><button class="btn pink" id="yes" style="min-height:48px;font-size:17px">Yes, erase</button><button class="btn alt" id="no" style="min-height:48px;font-size:17px">Keep it</button></div>';
    $('#yes').onclick=function(){var keep=S.name;S=defaults();S.name=keep;persist();renderGrown();};$('#no').onclick=renderGrown;};}

window.__test={align:align,normWord:normWord,match:match,makeCase:makeCase,TR:TR};
renderHome();
})();
</script>
